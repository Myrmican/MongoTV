<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MongoTV - Ordbog</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description" content="Den officiele MongoTV-ordbog.">
    <meta name="google-site-verification" content="774HfDz38bjYn3ah6h6kz5AwDGAhUz_0xxN7psTXIm8"/>
</head>
<body>
    <nav class="navbar">
        <div class="nav-logo">
            <a href="#">MongoTV</a>
        </div>
        <ul class="nav-links">
            <li><a href="/locations.html">Lokationer</a></li>
        </ul>

        <div class="toggle-container">
            <button id="theme-toggle">Skift tema</button>
        </div>
    </nav>

    <h1>Ordbog</h1>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Søg efter ord eller variant...">
    </div>
    
    <div id="dictionary-container"></div>

    <script src="src/main.js"></script>

    <script>
        const container = document.getElementById('dictionary-container');
        const searchInput = document.getElementById('search-input');

        let dictionaryData = [];

        fetch('dictionary-definitions.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Kunne ikke hente JSON-filen: ' + response.statusText);
                }
                return response.json();
            })
            .then(data => {
                dictionaryData = data;
                displayEntries(dictionaryData);
            })
            .catch(error => {
                console.error('Fejl:', error);
                container.innerHTML = `<p style="color:red;">Der skete en fejl under indlæsning af ordbogen.</p>`;
            });

        function playAudio(word) {
            const fileName = word.toLowerCase().trim();
            const audio = new Audio(`pronunciations/${fileName}.mp3`);
            
            audio.play().catch(error => {
                console.error("Kunne ikke afspille lydfilen. Tjek om den eksisterer i mappen:", error);
                alert("Udtale kunne ikke indlæses for dette ord.");
                return false;
            });

            return true;
        }

        async function audioExists(word) {
            const fileName = word.toLowerCase().trim();
            try {
                const response = await fetch(`pronunciations/${fileName}.mp3`, { method: 'HEAD' });
                return response.ok;
            } catch (error) {
                return false;
            }
        }

        function displayEntries(entries) {
            container.innerHTML = '';

            if (entries.length === 0) {
                container.innerHTML = '<p>Ingen resultater fundet.</p>';
                return;
            }

            entries.forEach(entry => {
                const entryDiv = document.createElement('div');
                entryDiv.className = 'dictionary-entry';

                const variantsText = entry.variants.length > 0 
                    ? `<div class="variants">Variant(er): ${entry.variants.join(', ')}</div>` 
                    : '';

                entryDiv.innerHTML = `
                    <div class="word-header" style="display: flex; align-items: center; gap: 10px;">
                        <h2 class="word" style="margin: 0;">${entry.word}</h2>
                        <span class="audio-btn-container"></span>
                    </div>
                    ${variantsText}
                    <p class="definition">${entry.definition}</p>
                    <p class="example"><strong>Eksempel:</strong> ${entry.example}</p>
                `;

                container.appendChild(entryDiv);

                audioExists(entry.word).then(exists => {
                    if (exists) {
                        const containerSpan = entryDiv.querySelector('.audio-btn-container');
                        if (containerSpan) {
                            containerSpan.innerHTML = `
                                <button class="audio-btn" onclick="playAudio('${entry.word.replace(/'/g, "\\'")}')" title="Hør udtale" style="background: none; border: none; cursor: pointer; font-size: 1.2rem;">🔊</button>
                            `;
                        }
                    }
                });
            });
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();

            const filteredEntries = dictionaryData.filter(entry => {
                const matchesWord = entry.word.toLowerCase().includes(searchTerm);
                const matchesVariant = entry.variants.some(variant => 
                    variant.toLowerCase().includes(searchTerm)
                );
                return matchesWord || matchesVariant;
            });

            displayEntries(filteredEntries);
        });
    </script>
</body>
</html>
